services:
  # ONE service: the SafeReport frontend folder IS the whole app
  # (Next.js UI + /api route handlers + uploads + AI analysis).
  # Docs: https://render.com/docs/blueprint-spec
  - type: web
    name: safereport
    runtime: node
    plan: free
    rootDir: .            # repo root — root scripts delegate to frontend/
    # npm workspace: one install covers the frontend app and Prisma
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false        # paste your Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: ''          # Render injects PORT automatically; if used, PORT must be 10000
      - key: NODE_ENV
        value: production
      - key: AI_API_KEY
        sync: false        # optional: BYO AI key instead of saving it in Settings → AI
      - key: AI_PROVIDER
        sync: false        # optional: openai | groq | openrouter | deepseek | gemini | anthropic | xai | mistral
      - key: AI_MODEL
        sync: false        # optional: model name override
